name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تثبيت Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت الحزم
        run: npm install

      - name: بناء ملفات EXE
        run: npm run build

      - name: رفع النتيجة كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaboto-Launcher
          path: dist/*.exe
          if-no-files-found: error

      - name: إنشاء Release دائم (عند نشر تاغ v)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

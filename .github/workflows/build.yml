name: بناء نسخة ويندوز EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    name: بناء FileForge.exe
    runs-on: windows-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: بناء الملف التنفيذي
        run: pyinstaller --onefile --windowed --clean --name FileForge --collect-all tkinterdnd2 app.py

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: FileForge-Windows-EXE
          path: dist/FileForge.exe
          if-no-files-found: error
